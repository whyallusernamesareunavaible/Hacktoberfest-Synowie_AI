<script>
const $=s=>document.querySelector(s);
const USER=(()=>{try{return localStorage.getItem('arena:session')}catch(e){return null}})();
const TOKEN=(()=>{try{return localStorage.getItem('arena:token')}catch(e){return null}})();
if(!USER||!TOKEN)location.replace('login.html');
$('#un_').textContent=USER||'';
function logout(){try{localStorage.removeItem('arena:session');localStorage.removeItem('arena:token')}catch(e){}location.href='login.html'}
const CL={war:{n:'Wojownik',c:'#c0503f'},mag:{n:'Mag',c:'#5b72e0'},rog:{n:'Łucznik',c:'#2f9e6e'}};
const S={cls:'war',eq:{}};

function effectsVolume(){const value=Number(localStorage.getItem('arena:effects-volume'));return Number.isFinite(value)?Math.max(0,Math.min(100,value))/100:1}
function musicVolume(){const value=Number(localStorage.getItem('arena:music-volume'));return Number.isFinite(value)?Math.max(0,Math.min(100,value))/100:1}
function playAttackSound(cls){const sound=attackSounds[cls];if(!sound||effectsVolume()<=0)return;sound.currentTime=0;sound.volume=effectsVolume();sound.play().catch(()=>{})}
const ostPath='the-tower-is-jammed-ost/';
const ost={
 intro:new Audio(ostPath+'konstruktorilogin.ogg'),
 nextFloor:new Audio(ostPath+'nowyfloorv2.ogg'),
 nextFloorAlt:new Audio(ostPath+'nowyfloor.ogg'),
 floorCompleted:new Audio(ostPath+'nowyfloor.ogg'),
 dungeon1:new Audio(ostPath+'The Tower is Jammed 05 - Dungeon BGM 1.ogg'),
 dungeon2:new Audio(ostPath+'The Tower is Jammed 06 - Dungeon BGM 2.ogg'),
 dungeon3:new Audio(ostPath+'The Tower is Jammed 07 - Dungeon BGM 3.ogg'),
 dungeon4:new Audio(ostPath+'The Tower is Jammed 08 - Dungeon BGM 4.ogg'),
 boss1:new Audio(ostPath+'The Tower is Jammed 09 - Boss Battle 1.ogg'),
 boss2:new Audio(ostPath+'The Tower is Jammed 10 - Boss Battle 2.ogg'),
 topFloor:new Audio(ostPath+'The Tower is Jammed 11 - The Top Floor.ogg'),
 enemyDeath:new Audio(ostPath+'zabicieprzeciwnika.ogg')
};
let activeMusic=null;
function playMusic(name){const music=ost[name];if(!music)return;if(musicVolume()<=0){if(activeMusic)activeMusic.pause();return}if(activeMusic===music&&!music.paused){music.volume=.28*musicVolume();return}if(activeMusic){activeMusic.pause();activeMusic.currentTime=0}activeMusic=music;music.loop=true;music.volume=.28*musicVolume();music.play().catch(()=>{})}
function playOstCue(name){if(musicVolume()<=0)return;const cue=ost[name];if(!cue)return;cue.loop=false;cue.currentTime=0;cue.volume=.45*musicVolume();cue.play().catch(()=>{})}
function updateArenaMusic(){if(A.lvl>=20){playMusic('topFloor');return}if(A.lvl%10===0){playMusic(A.lvl%20===0?'boss2':'boss1');return}if(A.lvl===1&&A.best===1){playMusic('intro');return}playMusic('dungeon'+(((A.lvl-1)%4)+1))}
let B={c:'war',t:{atk:30,hp:180,armor:44,crit:5,mob:30,mag:5,as:1.05}};
const calc=()=>({...B.t});
const R=String.raw;
const EN=[
 {id:'normal',n:'Grzyb',stats:[50,6,3,1]},
 {id:'toxic',n:'Grzyb Trujący',stats:[68,8,5,1.05]},
 {id:'armored',n:'Grzyb Pancerny',stats:[92,7,12,.9]},
 {id:'raging',n:'Grzyb Wściekły',stats:[58,12,4,1.35]}
];
const A={lvl:1,best:1,run:0,spd:1,gold:0,hp:null,gear:{},baseGear:{},shop:[],drop:null,pending:null,decision:null};
let currentEnemies=[],selectedTarget=0;
const monsterPath='Potwory/Mushroom/Mushroom%20without%20VFX/Mushroom-Idle.png';
const wizardPath='Wizard/Sprites/Idle.png';
function readSavedBuild(){try{const raw=localStorage.getItem('heroBuild');if(!raw)return null;const o=JSON.parse(raw);if(!CL[o.c]||!o.t||!['atk','hp','armor','crit','mob','mag','as'].every(k=>isFinite(o.t[k])&&o.t[k]>0))return null;return o}catch(e){return null}}
function readArenaProgress(){try{const raw=localStorage.getItem('arenaProgress');if(!raw)return null;const o=JSON.parse(raw);return o&&Number.isFinite(o.lvl)&&Number.isFinite(o.gold)?o:null}catch(e){return null}}
function buildSignature(build){return JSON.stringify({c:build.c,ch:build.ch,rk:build.rk||{},gear:build.gear||{},t:build.t})}
function saveArena(){try{localStorage.setItem('arenaProgress',JSON.stringify({buildSig:buildSignature(B),lvl:A.lvl,best:A.best,gold:A.gold,hp:A.hp,gear:A.gear,shop:A.shop,drop:A.drop,decision:A.decision}))}catch(e){log('Nie udało się zapisać postępu areny.','dn')}}
const mkE=(L,offset=0)=>{const boss=L%10===0&&!offset;if(boss){const k=1+.2*(L-10)/10,hp=Math.round(430*k);return{id:'wizard',n:'Evil Wizard',boss:true,hp,maxHp:hp,atk:22*k,armor:22*k,as:1.15}}const e=EN[(L-1+offset)%EN.length],k=1+.15*(L-1),hp=Math.round(e.stats[0]*k*(offset?0.82:1));return{...e,n:e.n+(offset?' — zwiadowca ':'')+(L>EN.length?' +'+Math.floor((L-1)/EN.length):''),hp,maxHp:hp,atk:e.stats[1]*k*(offset?0.9:1),armor:e.stats[2]*k,as:e.stats[3],boss:false}};
function gearStats(gear){const t={atk:0,hp:0,armor:0,crit:0,mob:0,mag:0,as:0};for(const it of Object.values(gear)){if(!it)continue;for(const k in it.st)t[k]=(t[k]||0)+it.st[k]}return t}
function arenaStats(){const t={...B.t},base=gearStats(A.baseGear),current=gearStats(A.gear);for(const k in base)t[k]-=base[k];for(const k in current)t[k]+=current[k];return t}
function fv(k,v){return k==='as'?Number(v).toFixed(2):Math.round(v*10)/10}
function itemText(it){return Object.entries(it.st).map(([k,v])=>(v>0?'+':'')+fv(k,v)+' '+({atk:'ATK',hp:'HP',armor:'pancerza',crit:'krytyka',mob:'mobilności',mag:'magii',as:'szybkości'}[k]||k)).join(', ')}
const slotNames={head:'Głowa',chest:'Klatka',weapon:'Broń',off:'Druga ręka',amulet:'Amulet',boots:'Buty',ring1:'Pierścień 1',ring2:'Pierścień 2'};
function itemType(it){return it&&(['ring1','ring2'].includes(it.t)?'ring':it.t)}
function allowedSlots(it){const type=itemType(it);return type==='ring'?['ring1','ring2']:[type]}
function slotPickerText(slot){return A.gear[slot]?A.gear[slot].n+' — '+itemText(A.gear[slot]):'Pusty slot'}
function equippedText(it){return allowedSlots(it).map(slot=>slotNames[slot]+': '+slotPickerText(slot)).join('<br>')}
function compareItem(it){const slots=allowedSlots(it);const old=A.gear[slots[0]];const keys=['atk','hp','armor','crit','mob','mag','as'];return `<div class="compare">${keys.filter(k=>it.st[k]!==undefined||old&&old.st[k]!==undefined).map(k=>`<span class="stat-new">${k.toUpperCase()}: ${it.st[k]===undefined?'—':(it.st[k]>0?'+':'')+fv(k,it.st[k])}</span><span class="stat-old">${k.toUpperCase()}: ${old&&old.st[k]!==undefined?(old.st[k]>0?'+':'')+fv(k,old.st[k]):'—'}</span>`).join('')}</div>`}
function renderShop(){if(!A.shop.length&&!A.drop){$('#shop').classList.remove('open');$('#drop').innerHTML='';$('#slotPicker').innerHTML='';$('#shopItems').innerHTML='';return}$('#shop').classList.add('open');$('#gold').textContent=A.gold;$('#drop').innerHTML=A.drop?`<div class="drop"><b>DROP: ${A.drop.n}</b><br>${itemText(A.drop)} <button class="chip" onclick="chooseDrop()">Wybierz slot</button></div>`:'';const pendingSlots=A.pending?allowedSlots(A.pending.item):[];$('#slotPicker').innerHTML=A.pending?`<div class="slot-picker"><h3>Wybierz slot dla: ${A.pending.item.n}</h3><div class="slot-buttons">${pendingSlots.map(slot=>`<button class="chip slot-button" onclick="replaceSlot('${slot}')">${slotNames[slot]}<small>${slotPickerText(slot)}</small></button>`).join('')}</div><button class="chip" onclick="cancelSlotChoice()">Anuluj</button></div>`:'';$('#shopItems').innerHTML=A.shop.map((it,i)=>`<div class="shop-item"><strong>${it.n} <span class="rarity rarity-${it.ri}">${['Zwykły','Rzadki','Epicki','Legendarny'][it.ri]}</span></strong><small>Pasuje do: ${allowedSlots(it).map(slot=>slotNames[slot]).join(' / ')}</small>${compareItem(it)}<small class="stat-new">Nowy przedmiot</small><small class="stat-old">Obecny przedmiot</small><b class="gold">${it.price} 🪙</b><button class="chip" onclick="chooseItem(${i})" ${A.gold<it.price?'disabled':''}>Wybierz przedmiot</button></div>`).join('')}
async function openShop(){try{const seed=cacheSeed(),response=await fetch(`${location.protocol}//${location.hostname}:8765/arena/shop`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},body:JSON.stringify({poziom:A.lvl,cache_seed:seed})}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Serwer odrzucił sklep');A.shop=data.items;renderShop();saveArena()}catch(error){log('Nie udało się pobrać sklepu z serwera: '+error.message,'dn')}}
function chooseDrop(){if(A.drop){A.pending={item:A.drop,drop:true};renderShop()}}
function chooseItem(i){const it=A.shop[i];if(it&&A.gold>=it.price){A.pending={item:it,index:i};renderShop()}}
function cancelSlotChoice(){A.pending=null;renderShop()}
function replaceSlot(slot){if(!A.pending)return;const pending=A.pending;if(!allowedSlots(pending.item).includes(slot)){log('Ten przedmiot nie pasuje do slotu '+(slotNames[slot]||slot)+'.','dn');return}const old=A.gear[slot];A.gear[slot]={...pending.item};delete A.gear[slot].price;if(pending.drop){A.drop=null;log('Podmieniasz slot '+slot+' na drop: '+pending.item.n+'.','up')}else{A.gold-=pending.item.price;A.shop.splice(pending.index,1);log('Kupujesz '+pending.item.n+' i podmieniasz slot '+slot+'.','up')}if(old)log('Zastępujesz: '+old.n+'.','mu');A.pending=null;renderShop();saveArena()}
const hb=(s,c,m)=>{$('#'+s+'bi').style.width=Math.max(0,c/m*100)+'%';$('#'+s+'tx').textContent=Math.max(0,Math.round(c))+' / '+Math.round(m)};
function log(t,c){const l=$('#lg'),d=document.createElement('div');d.textContent=t;d.className=c||'';l.prepend(d);while(l.children.length>60)l.lastChild.remove()}
function setEnemyCard(card,e,prefix){const f=$(prefix+'f'),name=$(prefix+'nm'),bar=$(prefix+'bi'),tx=$(prefix+'tx'),maxHp=e?.maxHp||e?.hp||1;if(!e){card.hidden=true;return}card.hidden=false;const key=(e.boss?'boss:':'enemy:')+e.id+':'+e.n;if(card.dataset.enemyKey!==key){card.dataset.enemyKey=key;card.classList.toggle('boss-card',!!e.boss);name.textContent=e.n;name.className=e.boss?'boss-label':'';f.className=`sprite ${e.boss?'boss-wizard':'monster-sprite monster-'+e.id} fg`;f.style.backgroundImage=`url("${e.boss?wizardPath:monsterPath}")`;f.setAttribute('aria-label',e.n)}bar.style.width=Math.max(0,e.hp/maxHp*100)+'%';tx.textContent=Math.max(0,e.hp)+' / '+maxHp;if(e.hp<=0){playOstCue('enemyDeath');if(!card.classList.contains('enemy-death')){card.classList.add('enemy-death');clearTimeout(card.deathTimer);card.deathTimer=setTimeout(()=>{if(e.hp<=0)card.hidden=true},700)}}else if(card.classList.contains('enemy-death')){card.classList.remove('enemy-death')}}
function renderArena(enemies=currentEnemies.length?currentEnemies:[mkE(A.lvl)]){
 const P=arenaStats(),E=enemies[0],E2=enemies[1];
 $('#lv').textContent=A.lvl;$('#bs').textContent=A.best;$('#pnm').textContent=CL[S.cls].n;
 $('#pf').style.backgroundImage=`url("${characterPath(B.ch||1)}")`;
 setEnemyCard($('#ef').parentElement.parentElement,E,'#e');setEnemyCard($('#e2f').parentElement.parentElement,E2,'#e2');$('#enemy2Card').hidden=!E2;
 $('#enm').textContent=E.n;const currentHp=Number.isFinite(A.hp)?Math.min(A.hp,P.hp):P.hp;
 hb('p',currentHp,P.hp);if(E)hb('e',E.hp,E.hp);if(E2)hb('e2',E2.hp,E2.hp);$('#go').disabled=!!A.run||!!A.decision}
function showDecision(title,cards){const box=$('#decisionPanel');box.classList.add('open');box.innerHTML=`<h3 class="decision-title">${title}</h3><div class="decision-grid">${cards.join('')}</div>`}
function hideDecision(){A.decision=null;$('#decisionPanel').classList.remove('open');$('#decisionPanel').innerHTML=''}
function showTargetChoice(){A.decision='target';showDecision('Wybierz przeciwnika do ataku',currentEnemies.map((e,i)=>`<button class="decision-card target-card" onclick="startFight(${i})"><b>${i+1}. ${e.n}</b><small>HP: ${e.hp}</small><small>Atak: ${Math.round(e.atk)}</small><small>Kliknij, aby obrać cel</small></button>`));saveArena()}
function startFight(target){selectedTarget=target;hideDecision();fightRound()}
function showHealChoice(){A.decision='heal';showDecision('Odpoczynek po pięciu poziomach',[`<button class="decision-card" onclick="useHeal()"><b>❤️ Użyj leczenia</b><small>Przywróć 10% maksymalnego HP.</small><small>Aktualnie: ${Math.round(A.hp)} / ${Math.round(arenaStats().hp)}</small></button>`,`<button class="decision-card" onclick="skipHeal()"><b>🛡️ Zachowaj leczenie</b><small>Nie lecz teraz i zachowaj ryzyko.</small></button>`]);saveArena()}
function useHeal(){const P=arenaStats();A.hp=Math.min(P.hp,A.hp+P.hp*.1);log('Używasz leczenia: +10% maksymalnego HP.','up');hideDecision();continuePostBattle(false);saveArena();renderArena()}
function skipHeal(){log('Oszczędzasz leczenie.','mu');hideDecision();continuePostBattle();saveArena()}
function showEventChoice(){A.decision='event';showDecision('Tajemnicza ścieżka',[`<button class="decision-card event-card" onclick="takeEvent()"><b>🚶 Idź ścieżką</b><small>Jej wynik zostanie wylosowany.</small></button>`,`<button class="decision-card" onclick="skipEvent()"><b>🚪 Nie idź</b><small>Bez nagrody i bez obrażeń.</small></button>`]);saveArena()}
async function takeEvent(){const seed=cacheSeed();try{const response=await fetch(`${location.protocol}//${location.hostname}:8765/arena/event`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},body:JSON.stringify({poziom:A.lvl,cache_seed:seed,max_hp:arenaStats().hp})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Serwer odrzucił wydarzenie');if(data.typ==='pułapka'){A.hp=Math.max(1,A.hp-data.obrazenia);log('Serwer rozstrzygnął pułapkę: tracisz '+data.obrazenia+' HP.','dn')}else{A.drop=data.drop;log('Serwer przyznał przedmiot: '+A.drop.n+'.','ac')}hideDecision();continuePostBattle(false);saveArena();renderArena()}catch(error){log('Nie udało się rozstrzygnąć wydarzenia: '+error.message,'dn')}}
function skipEvent(){log('Omijasz tajemniczą ścieżkę.','mu');hideDecision();continuePostBattle();saveArena()}
function continuePostBattle(eventAvailable=false){if(A.lvl%5===0&&!A.healDone){A.healDone=true;showHealChoice();return}A.healDone=false;if(eventAvailable){showEventChoice();return}if(A.drop)renderShop();setTimeout(()=>{if(!A.run&&!A.decision){updateArenaMusic();renderArena()}},700)}
function tab(n){document.querySelector('.app').style.display=n?'none':'';$('#ar').style.display=n?'block':'none';$('#t0').classList.toggle('on',!n);$('#t1').classList.toggle('on',!!n);if(n&&!A.run)renderArena()}
function spd(){A.spd=A.spd==1?2:A.spd==2?4:1;$('#sp').textContent='Prędkość x'+A.spd}
function fx(a,txt,cls){const d=a=='p'?'e':'p',fa=$('#'+a+'f'),fd=$('#'+d+'f');
 fa.classList.add('atk');setTimeout(()=>fa.classList.remove('atk'),150);
 if(cls!='miss'){fd.classList.add('sh');setTimeout(()=>fd.classList.remove('sh'),300)}
 const s=document.createElement('span');s.className='fl '+cls;s.textContent=txt;fd.parentNode.appendChild(s);setTimeout(()=>s.remove(),900)}
function cacheSeed(){const a=new Uint32Array(1);if(window.crypto?.getRandomValues)window.crypto.getRandomValues(a);else a[0]=Date.now()>>>0;return a[0]}
async function fight(){if(A.run||A.decision)return;A.run=1;$('#go').disabled=true;updateArenaMusic();renderArena();const seed=cacheSeed();log('Serwer oblicza walkę (cache '+seed+').','mu');try{const response=await fetch(`${location.protocol}//${location.hostname}:8765/arena/battle`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${TOKEN}`},body:JSON.stringify({build:{nazwa:USER,klasa:{war:'wojownik',mag:'mag',rog:'lotrzyk'}[S.cls],staty:arenaStats()},poziom:A.lvl,cache_seed:seed})});const data=await response.json();if(!response.ok)throw new Error(data.detail||data.errors&&Object.values(data.errors).join(', ')||'Serwer odrzucił walkę');await animateServerBattle(data)}catch(error){A.run=0;$('#go').disabled=false;log('Nie udało się wykonać walki na serwerze: '+error.message,'dn')}}
async function animateServerBattle(data){const P=arenaStats(),E={id:data.boss?'wizard':'server',n:data.przeciwnik.nazwa,boss:data.boss,hp:data.przeciwnik.max_hp,maxHp:data.przeciwnik.max_hp,atk:data.przeciwnik.atak,armor:data.przeciwnik.pancerz,as:data.przeciwnik.szybkosc};currentEnemies=[E];renderArena(currentEnemies);log('Walka z '+E.n+' została policzona przez serwer.','mu');for(const event of data.zdarzenia){const player=event.atakujacy==='gracz';const enemyHp=event.hp_wroga??(player?event.hp_celu:E.hp);const playerHp=event.hp_gracza??(!player?event.hp_celu:A.hp);if(player){E.hp=enemyHp;playAttackSound(S.cls);fx('p',event.typ==='krytyk'?'KRYT -'+event.obrazenia:event.typ==='unik'?'unik':'-'+event.obrazenia,event.typ==='krytyk'?'crit':event.typ==='unik'?'miss':'dmg');hb('e',E.hp,E.maxHp)}else{A.hp=playerHp;fx('e',event.typ==='unik'?'unik':'-'+event.obrazenia,event.typ==='unik'?'miss':'dmg');hb('p',A.hp,P.hp)}setEnemyCard($('#ef').parentElement.parentElement,E,'#e');await new Promise(resolve=>setTimeout(resolve,Math.max(80,650/A.spd)))}A.run=0;$('#go').disabled=false;if(data.zwyciezca==='gracz'){A.gold+=data.nagroda;A.lvl++;A.best=Math.max(A.best,A.lvl);A.hp=data.boss?P.hp:data.gracz.hp;playOstCue(data.boss?'floorCompleted':A.lvl%2===0?'nextFloorAlt':'nextFloor');log('Zwycięstwo! Serwer przyznał '+data.nagroda+' złota.','up');if(data.drop){A.drop=data.drop;log('Serwer przyznał drop: '+A.drop.n+'.','ac')}if(data.boss)openShop();continuePostBattle(data.event_available)}else{A.hp=data.gracz.hp;log('Porażka. Wynik został ustalony przez serwer.','dn')}currentEnemies=[];saveArena();renderArena()}


const savedBuild=readSavedBuild(),savedArena=readArenaProgress();
if(savedBuild){B=savedBuild;S.cls=savedBuild.c;$('#saveStatus').textContent='Zapisany build: '+CL[savedBuild.c].n;$('#saveStatus').className='up'}
else $('#saveStatus').textContent='Brak zapisanego buildu — używam Wojownika';
if(savedBuild&&savedBuild.gear){A.baseGear=savedBuild.gear;A.gear=savedBuild.gear}
if(savedArena&&(!savedArena.buildSig||savedArena.buildSig===buildSignature(B))){A.lvl=savedArena.lvl;A.best=savedArena.best;A.gold=savedArena.gold;A.hp=Number.isFinite(savedArena.hp)?savedArena.hp:null;A.gear={...A.gear,...(savedArena.gear||{})};A.shop=savedArena.shop||[];A.drop=savedArena.drop||null}
if(!Number.isFinite(A.hp))A.hp=arenaStats().hp;
updateArenaMusic();renderArena();if(savedArena&&savedArena.decision==='heal')showHealChoice();if(savedArena&&savedArena.decision==='event')showEventChoice();log(savedBuild?'Automatycznie wczytano zapisany build.':'Domyślny Wojownik. Otwórz Kreator, aby zapisać swój build.','mu');
renderShop();
const settingsButton=document.querySelector('.settings-button'),settingsMenu=document.querySelector('#settings-menu'),motionToggle=document.querySelector('#reduced-motion'),effectsVolumeInput=document.querySelector('#effects-volume'),musicVolumeInput=document.querySelector('#music-volume'),effectsVolumeValue=document.querySelector('#effects-volume-value'),musicVolumeValue=document.querySelector('#music-volume-value');
const applyMotion=()=>{const reduced=localStorage.getItem('arena:reduced-motion')==='1';motionToggle.checked=reduced;document.documentElement.classList.toggle('reduced-motion',reduced)};
const applyAudio=()=>{effectsVolumeInput.value=Math.round(effectsVolume()*100);musicVolumeInput.value=Math.round(musicVolume()*100);effectsVolumeValue.textContent=effectsVolumeInput.value+'%';musicVolumeValue.textContent=musicVolumeInput.value+'%';if(activeMusic)activeMusic.volume=.28*musicVolume();if(musicVolume()<=0&&activeMusic)activeMusic.pause();else if(musicVolume()>0)updateArenaMusic()};
settingsButton.onclick=()=>{const open=settingsMenu.hidden;settingsMenu.hidden=!open;settingsButton.setAttribute('aria-expanded',String(open))};
motionToggle.onchange=()=>{localStorage.setItem('arena:reduced-motion',motionToggle.checked?'1':'0');applyMotion()};
effectsVolumeInput.oninput=effectsVolumeInput.onchange=()=>{localStorage.setItem('arena:effects-volume',effectsVolumeInput.value);applyAudio()};
musicVolumeInput.oninput=musicVolumeInput.onchange=()=>{localStorage.setItem('arena:music-volume',musicVolumeInput.value);applyAudio()};
applyMotion();applyAudio();
</script></body></html>
